<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#030409" />
    </linearGradient>

    <!-- Electric Cyan to Emerald Gradient -->
    <linearGradient id="rpgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="url(#coreGlow)" />
  
  <!-- Hex Shield Outline -->
  <polygon points="256,48 436,136 436,376 256,464 76,376 76,136" 
           fill="none" 
           stroke="url(#rpgGrad)" 
           stroke-width="12" 
           stroke-linejoin="round"
           filter="url(#glow)" />
           
  <polygon points="256,66 418,145 418,367 256,446 94,367 94,145" 
           fill="#0c1329" 
           stroke="#1e293b" 
           stroke-width="3" />

  <!-- Inner Level Crystal / Sword Motif -->
  <!-- Top Crystal -->
  <polygon points="256,110 320,200 256,230 192,200" fill="url(#rpgGrad)" />
  <polygon points="256,110 256,230 320,200" fill="#00f0ff" opacity="0.8" />
  <polygon points="256,110 256,230 192,200" fill="#0ea5e9" opacity="0.9" />

  <!-- Central Core / Diamond -->
  <polygon points="256,200 350,256 256,360 162,256" fill="url(#rpgGrad)" filter="url(#glow)" opacity="0.95" />
  <polygon points="256,200 350,256 256,360" fill="#00f0ff" opacity="0.4" />
  <polygon points="256,200 162,256 256,360" fill="#10b981" opacity="0.5" />
  
  <!-- Sword Blade Cross / Tech Chevron -->
  <path d="M256,150 L256,380" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <path d="M220,280 L256,310 L292,280" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M200,340 L256,390 L312,340" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Level Gem Indicator -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="7" fill="#00f0ff" />
</svg>
